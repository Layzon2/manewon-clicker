<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a1a0e">
  <title>Manewon Clicker</title>
  <meta name="description" content="Милый кликер, где нужно бесконечно нажимать на MANEWON и собирать бесполезные Note Coins.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Декоративный фон -->
  <div class="bg-decor" aria-hidden="true"></div>

  <!-- Частицы при движении -->
  <div class="particle-layer" id="particleLayer" aria-hidden="true"></div>

  <header class="header">
    <div class="coin-bar">
      <div class="coin-icon" id="coinIcon" role="button" tabindex="0" aria-label="Информация о нота-монетах">
        <svg class="coin-svg" viewBox="0 0 32 32" aria-hidden="true">
          <defs>
            <radialGradient id="coinGrad" cx="50%" cy="50%" r="50%" fx="40%" fy="40%">
              <stop offset="0%" stop-color="#fde68a"/>
              <stop offset="60%" stop-color="#fcd34d"/>
              <stop offset="100%" stop-color="#d97706"/>
            </radialGradient>
            <filter id="coinGlow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="2.5" result="blur"/>
              <feComposite in="SourceGraphic" in2="blur" operator="over"/>
            </filter>
          </defs>
          <circle cx="16" cy="16" r="14" fill="url(#coinGrad)" stroke="#b45309" stroke-width="1.4" filter="url(#coinGlow)"/>
          <circle cx="16" cy="16" r="10" fill="none" stroke="#fef3c7" stroke-width="1" stroke-dasharray="6 4" opacity="0.7"/>
          <path d="M14.5 20q0 0.8 0.6 1.3t1.6 0.6q1.1 0 1.8-0.8l0.8-2.2q-0.6 0.5-1.4 0.5q-0.9 0-1.4-0.6t-0.4-1.6q0-0.9 0.6-1.5t1.6-0.6q1 0 1.6 0.7l-0.5 1.7q-0.5-0.3-1.1-0.3q-0.7 0-1.2 0.4t-0.5 1.2q0 0.8 0.5 1.3t1.3 0.5q0.6 0 1-0.4t0.4-1q0-0.6-0.4-1t-1-0.4q-0.7 0-1.1 0.4t-0.4 1.1q0 0.8 0.5 1.3t1.3 0.5z" fill="#b45309"/>
          <line x1="16.5" y1="13" x2="20" y2="13" stroke="#b45309" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="coin-info">
        <div class="coin-label">Note Coins</div>
        <div class="coin-value" id="coinValue">0</div>
      </div>
      <div class="stats-chip" id="statsChip" title="Статистика">
        <span id="statLine">Нажатий: <span id="statClicks">0</span> • Заработано: <span id="statCoins">0</span></span>
        <div id="statTimer">Сессия: <span id="statTime">0:00</span></div>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="button-wrap" id="buttonWrap">
      <button class="manewon-btn" id="manewonBtn" type="button" aria-label="Нажми на MANEWON">
        <span class="btn-text">MANEWON</span>
        <div class="btn-shine"></div>
        <div class="combo-badge" id="comboBadge">x1</div>
      </button>
    </div>
    <div class="float-layer" id="floatLayer" aria-hidden="true"></div>
  </main>

  <div class="controls">
    <div class="music-control">
      <button class="music-toggle" id="musicToggle" type="button" aria-label="Включить/выключить музыку" aria-pressed="false">♪</button>
      <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="0.5" aria-label="Громкость музыки">
      <span class="volume-text" id="volumeText">50%</span>
    </div>
    <button class="shop-btn" id="shopBtn" type="button">🛒 Магазин тем</button>
    <button class="skins-btn" id="skinsBtn" type="button">🎨 Скины кнопки</button>
    <button class="achievements-btn" id="achievementsBtn" type="button">🏆 Достижения</button>
    <button class="share-btn" id="shareBtn" type="button">📤 Поделиться</button>
    <button class="daynight-btn" id="dayNightBtn" type="button">☀️/🌙</button>
    <button class="reset-btn" id="resetBtn" type="button">Сбросить прогресс</button>

    <!-- Активация админ-панели по промокоду -->
    <div class="admin-promo">
      <input type="text" id="adminPromoInput" placeholder="Промокод админа..." maxlength="20">
      <button class="admin-promo-btn" id="adminPromoBtn" type="button">Активировать</button>
    </div>
  </div>

  <!-- Фоновое аудио -->
  <audio id="bgAudio" src="plach%20F%23min%20140bpm%20430hz.mp3" loop preload="auto"></audio>

  <!-- Модалка монеты -->
  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal">
      <button class="modal-close" id="modalClose" type="button" aria-label="Закрыть">×</button>
      <div class="modal-icon">🪙</div>
      <div class="modal-text">«За эту хуйню нельзя ничё купить»</div>
    </div>
  </div>

  <!-- Магазин тем -->
  <div class="modal-overlay" id="shopOverlay" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal shop-modal">
      <button class="modal-close" id="shopClose" type="button" aria-label="Закрыть магазин">×</button>
      <div class="shop-header">
        <div class="shop-title">🛒 Магазин тем</div>
        <div class="shop-coins">🪙 <span id="shopCoinValue">0</span></div>
      </div>
      <div class="shop-hint">Выбери тему оформления сайта</div>
      <div class="theme-grid" id="themeGrid"></div>
      <div class="promo-section">
        <div class="promo-label">Есть промокод?</div>
        <input type="text" id="promoInput" placeholder="Введи промокод..." maxlength="20">
        <button class="promo-btn" id="promoBtn" type="button">Активировать</button>
      </div>
    </div>
  </div>

  <!-- Скины кнопки -->
  <div class="modal-overlay" id="skinsOverlay" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal skins-modal">
      <button class="modal-close" id="skinsClose" type="button" aria-label="Закрыть скины">×</button>
      <div class="shop-header">
        <div class="shop-title">🎨 Скины кнопки</div>
        <div class="shop-coins">🪙 <span id="skinCoinValue">0</span></div>
      </div>
      <div class="shop-hint">Выбери внешний вид центральной кнопки</div>
      <div class="theme-grid" id="skinGrid"></div>
    </div>
  </div>

  <!-- Достижения -->
  <div class="modal-overlay" id="achievementsOverlay" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal achievements-modal">
      <button class="modal-close" id="achievementsClose" type="button" aria-label="Закрыть достижения">×</button>
      <div class="ach-header">🏆 Достижения</div>
      <div class="ach-grid" id="achGrid"></div>
    </div>
  </div>

  <!-- Тост-уведомления контейнер -->
  <div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>

  <script src="script.js"></script>
</body>
</html>
